[package]
name = "photo-exif-analyzer"
version = "0.1.0"
description = "A photo EXIF analyzer"
authors = ["you"]
edition = "2021"

[lib]
name = "photo_exif_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "fs-read-dir", "fs-read-file", "path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
